name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, queueing without canceling in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  RENPY_VERSION: "8.3.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Cache Ren'Py SDK + web support
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: renpy-sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}-with-web-v1

      - name: Download Ren'Py SDK and web support
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          wget -q "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          tar xf "renpy-${RENPY_VERSION}-sdk.tar.bz2"
          mv "renpy-${RENPY_VERSION}-sdk" renpy-sdk
          rm "renpy-${RENPY_VERSION}-sdk.tar.bz2"

          wget -q "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-web.zip"
          unzip -q "renpy-${RENPY_VERSION}-web.zip" -d renpy-sdk/
          rm "renpy-${RENPY_VERSION}-web.zip"

      - name: Make Ren'Py executable
        run: chmod +x renpy-sdk/renpy.sh

      - name: Build web distribution
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          set -euxo pipefail
          ./renpy-sdk/renpy.sh renpy-sdk/launcher distribute \
            "$GITHUB_WORKSPACE/project" \
            --package web

      - name: Stage site for Pages
        run: |
          set -euxo pipefail

          # Ren'Py's web build lands in <project-name>-dists/ as either a folder
          # ending in -web or a zip ending in -web.zip. Handle both cases.
          DIST_DIR=$(find . -type d -name "*-dists" -not -path "./renpy-sdk/*" | head -1)
          if [ -z "$DIST_DIR" ]; then
            echo "ERROR: no -dists directory was produced." >&2
            find . -maxdepth 4 -type d >&2
            exit 1
          fi

          echo "Distribution directory: $DIST_DIR"
          ls -la "$DIST_DIR"

          mkdir -p _site

          WEB_DIR=$(find "$DIST_DIR" -maxdepth 1 -type d -name "*-web" | head -1)
          WEB_ZIP=$(find "$DIST_DIR" -maxdepth 1 -type f -name "*-web.zip" | head -1)

          if [ -n "$WEB_DIR" ]; then
            echo "Using web build directory: $WEB_DIR"
            cp -r "$WEB_DIR"/* _site/
          elif [ -n "$WEB_ZIP" ]; then
            echo "Using web build zip: $WEB_ZIP"
            unzip -q "$WEB_ZIP" -d _site
            # If the zip wrapped its contents in a single top-level folder, hoist them.
            INNER=$(find _site -mindepth 1 -maxdepth 1 -type d | head -1)
            if [ "$(ls -1 _site | wc -l)" -eq 1 ] && [ -n "$INNER" ] && [ ! -f _site/index.html ]; then
              shopt -s dotglob
              mv "$INNER"/* _site/
              rmdir "$INNER"
            fi
          else
            echo "ERROR: neither a *-web directory nor a *-web.zip was found in $DIST_DIR" >&2
            exit 1
          fi

          echo "Final _site contents:"
          ls -la _site
          test -f _site/index.html || { echo "ERROR: index.html not found in _site"; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
