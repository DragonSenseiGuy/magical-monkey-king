name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, queueing without canceling in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  RENPY_VERSION: "8.3.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Cache Ren'Py SDK + web support
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: renpy-sdk
          key: renpy-sdk-${{ env.RENPY_VERSION }}-with-web-v1

      - name: Download Ren'Py SDK and web support
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          wget -q "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          tar xf "renpy-${RENPY_VERSION}-sdk.tar.bz2"
          mv "renpy-${RENPY_VERSION}-sdk" renpy-sdk
          rm "renpy-${RENPY_VERSION}-sdk.tar.bz2"

          wget -q "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-web.zip"
          unzip -q "renpy-${RENPY_VERSION}-web.zip" -d renpy-sdk/
          rm "renpy-${RENPY_VERSION}-web.zip"

      - name: Make Ren'Py executable
        run: chmod +x renpy-sdk/renpy.sh

      - name: Build web (HTML5) distribution
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          set -euxo pipefail
          mkdir -p web-out
          # The dedicated CLI for web builds (Ren'Py docs: Command Line Interface > Web Build).
          # Distinct from `distribute`, which only produces desktop packages.
          ./renpy-sdk/renpy.sh renpy-sdk/launcher web_build \
            "$GITHUB_WORKSPACE/project" \
            --destination "$GITHUB_WORKSPACE/web-out"

      - name: Stage site for Pages
        run: |
          set -euxo pipefail

          echo "web-out contents:"
          ls -la web-out

          mkdir -p _site

          # web_build writes index.html etc. directly into --destination,
          # but some Ren'Py versions wrap them in a single subdirectory.
          if [ -f web-out/index.html ]; then
            cp -r web-out/* _site/
          else
            INNER=$(find web-out -mindepth 1 -maxdepth 1 -type d | head -1)
            if [ -n "$INNER" ] && [ -f "$INNER/index.html" ]; then
              cp -r "$INNER"/* _site/
            else
              echo "ERROR: no index.html found in the web build output" >&2
              find web-out -maxdepth 3 -type f | head -50 >&2
              exit 1
            fi
          fi

          echo "Final _site contents:"
          ls -la _site
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
